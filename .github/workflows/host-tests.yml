name: Elevador - host regression tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  native-tests:
    name: GPIO/NVS/HTTP regression (host mocks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run host-only checks (no physical motor)
        run: python3 tests/validate.py

  esp-idf-build:
    name: ESP-IDF 5.3.1 / esp32c3 firmware build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build for ESP32-C3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32c3
          path: .
