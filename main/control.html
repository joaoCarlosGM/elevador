<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elevador NeoTech Pro</title>
    <style>
        body { margin: 0; background: radial-gradient(circle at top, #080014 0%, #04010a 100%); font-family: 'Segoe UI', sans-serif; color: #d9d9ff; text-align: center; padding-bottom: 30px; }
        h1 { margin-top: 15px; }
        #elevadorBox { width: 140px; height: 260px; border: 3px solid #673ab7; border-radius: 20px; margin: 15px auto; position: relative; background: rgba(255, 255, 255, 0.03); box-shadow: 0 0 20px #673ab788 inset; }
        #cabine { width: 100px; height: 60px; background: rgba(0, 234, 255, 0.1); border: 2px solid #00eaff; border-radius: 10px; position: absolute; left: 50%; transform: translateX(-50%); bottom: 10px; transition: bottom 0.5s ease-out; box-shadow: 0 0 15px #00eaff66; }
        .config-box, #statusBox { width: 280px; margin: 15px auto; padding: 15px; border-radius: 15px; background: rgba(255,255,255,0.05); text-align: left; border: 1px solid #333; box-sizing: border-box; }
        button { font-size: 16px; padding: 12px; width: 200px; border: none; border-radius: 10px; margin: 5px; cursor: pointer; color: #fff; background: linear-gradient(135deg, #6200ea, #3700b3); font-weight: bold; transition: transform 0.1s; }
        button:active { transform: scale(0.95); }
        .stop { background: linear-gradient(135deg, #ff1744, #b20000); height: 70px; font-size: 18px; }
        .save { background: #00b8d4; width: 100%; margin-top: 15px; }
        input[type=range], input[type=number] { width: 100%; margin-top: 8px; background: #111; color: #00eaff; border: 1px solid #444; padding: 8px; border-radius: 8px; box-sizing: border-box; accent-color: #00eaff; }
        .on { color: #00eaff; font-weight: bold; }
        .off { color: #ff4f6f; }
        label { font-size: 14px; font-weight: bold; color: #bbb; display: block; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>🚀 NeoTech Pro</h1>
    
    <div id="elevadorBox"><div id="cabine"></div></div>

    <button onclick='cmd("up")'>🔼 SUBIR (HOME)</button><br>
    <button onclick='cmd("down")'>🔽 DESCER (TEMPO)</button><br>
    <button class="stop" onclick='cmd("stop")'>⏹️ PARAR</button>
    
    <div class="config-box">
        <label>Velocidade PWM (80 - 255): <span id="velVal" class="on">200</span></label>
        <input type="range" id="speed" min="80" max="255" value="200" oninput="document.getElementById('velVal').innerText=this.value">
        
        <label>Tempo de Descida (ms):</label>
        <input type="number" id="time" min="500" max="20000" value="3000">

        <button class="save" onclick="saveSettings()">💾 Salvar Configurações</button>
    </div>

    <div id="statusBox">
        <div id="motorTxt">Motor: --</div>
        <div id="cimaTxt">Fim Superior (HOME): --</div>
        <div id="posTxt">Posição Estimada: --</div>
    </div>
    
    <script>
        function cmd(action) { fetch('/api/' + action, { method: 'POST' }); }
        
        function saveSettings() {
            const v = document.getElementById('speed').value;
            const t = document.getElementById('time').value;
            fetch(`/api/settings?v=${v}&t=${t}`, { method: 'POST' });
        }

        setInterval(() => {
            fetch('/api/status').then(r => r.json()).then(data => {
                // Atualiza Textos
                document.getElementById("motorTxt").innerHTML = "Motor: " + (data.state !== "IDLE" ? `<span class='on'>${data.state}</span>` : "<span class='off'>PARADO</span>");
                document.getElementById("cimaTxt").innerHTML = "Fim Superior: " + (data.home_active ? "<span class='on'>ATIVADO</span>" : "<span class='off'>LIVRE</span>");
                document.getElementById("posTxt").innerHTML = `Deslocamento: <span class='on'>${data.elapsed_ms} ms</span>`;
                
                // Animação da Cabine baseada no tempo
                let cab = document.getElementById("cabine");
                if (data.home_active) {
                    cab.style.bottom = "190px";
                } else if (data.state === "DOWN" || data.state === "IDLE") {
                    // Calcula a altura da cabine baseado no tempo decorrido (10px até 190px)
                    let pct = 1 - (data.elapsed_ms / data.descent_time);
                    if (pct < 0) pct = 0; if (pct > 1) pct = 1;
                    cab.style.bottom = (10 + (pct * 180)) + "px";
                }
            }).catch(e => {});
        }, 300);
    </script>
</body>
</html>
